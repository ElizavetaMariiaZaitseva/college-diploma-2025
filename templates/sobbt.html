<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <title>{% block title %}{% endblock %}</title>
</head>
<body>
    <div class="container"></div>
        <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
            <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
              <img class="header__img" src="{{ url_for('static', filename='img/m.png') }}" alt="m">
            </a>

          <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
            <li><a href="{{ url_for('index') }}" class="nav-link px-2 link-secondary">Главная</a></li>
            <li><a href="{{ url_for('about') }}" class="nav-link px-2">Концерты</a></li>
            <li><a href="{{ url_for('teatr') }}" class="nav-link px-2 link-secondary">Театр</a></li>
              <li><a href="{{ url_for('conc') }}" class="nav-link px-2 link-secondary">Кино</a></li>
            <li><a href="{{ url_for('sob') }}" class="nav-link px-2 link-secondary">Ближайшие события</a></li>
          </ul>

          <div class="col-md-3 text-end">
            <button><a class="btn btn-primary" href="{{ url_for('registration') }}">Регистрация</a>
            <button><a class="btn btn-primary" type="submit" href="{{ url_for('signin') }}">Вход</a>
          </div>
        </header>
        {% block body %}{% endblock %}
<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <div class="col-md-4 d-flex align-items-center">
      <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
        <img class="footer__img" src="{{ url_for('static', filename='img/m.png') }}" alt="m">
      </a>
      <span class="mb-3 mb-md-0 text-body-secondary">© 2024 Company, Inc</span>
    </div>

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <img class="footer__img" src="{{ url_for('static', filename='img/tg.png') }}" alt="tg">

    </ul>
  </footer>
    </div>
</body>
</html>
